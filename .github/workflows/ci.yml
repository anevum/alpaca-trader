name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m scripts.staging_check
      - run: python -m pytest -q tests/test_rhen44_*.py
      - run: python -m py_compile app/config.py app/equity_sessions.py app/extended_equity.py app/execution.py app/main.py
      - run: python -m pytest -q tests/test_extended_equity.py tests/test_strategy.py tests/test_rolling_strategy.py tests/test_sizing.py tests/test_risk.py
      - run: python -m pytest -q tests/test_iren_codex_handoff.py tests/test_iren_executor_service.py tests/test_iren_control_plane.py tests/test_iren_runtime_evidence.py tests/test_iren_executor.py tests/test_iren_work.py tests/test_runtime_topology.py
      - run: python -m pytest -q tests/test_foundation_command_iren.py tests/test_foundation_graen_gateway.py tests/test_foundation_ingest.py tests/test_foundation_iren_gateway.py tests/test_foundation_outbox.py tests/test_foundation_parity.py tests/test_foundation_public_feed.py tests/test_foundation_report_read.py tests/test_foundation_research_agent_gateway.py tests/test_foundation_shadow.py
      - run: python -m pytest -q tests/test_strategy_health.py tests/test_counterfactual_lab.py tests/test_adaptation_proposal.py tests/test_research_reporting.py tests/test_research_agent_runner.py tests/test_research_scheduler.py tests/test_slack_notifier.py tests/test_slack_brand.py tests/test_replay.py tests/test_velum.py tests/test_velum_manifest.py tests/test_orchestration_scheduler.py tests/test_scheduler_ledger_schema.py tests/test_preopen_safety.py tests/test_production_hardening.py tests/test_nostra_runtime.py tests/test_rhen_core_v3.py
      - run: python -m pytest -q tests/test_research_package.py tests/test_strategy_router.py tests/test_rule_set_lab.py tests/test_offline_experiment_queue.py

  codex-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: codex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/codex_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==8.3.5
      - name: Apply and reapply canonical migrations in isolated database
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" python -m foundation.migrator.run
          DATABASE_URL="$TEST_DATABASE_URL" python -m foundation.migrator.run
      - run: python -m pytest -q tests/test_iren_handoff_postgres.py
