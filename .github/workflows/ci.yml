name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m scripts.staging_check
      - run: python -m pytest -q tests/test_strategy_health.py tests/test_research_agent_runner.py tests/test_replay.py tests/test_velum.py tests/test_graen_crypto_v5.py tests/test_velum_manifest.py
