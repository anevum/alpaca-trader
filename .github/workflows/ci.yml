name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m scripts.staging_check
      - run: python -m py_compile app/platform_core/broker.py app/platform_core/contracts.py app/platform_core/reconciliation.py app/platform_core/money.py app/platform_core/alpaca_broker_sandbox.py foundation/platform_core_gateway.py
      - run: python -m pytest -q tests/test_platform_core_contracts.py tests/test_platform_broker_reconciliation.py tests/test_platform_core_schema.py tests/test_platform_broker_schema.py tests/test_platform_money.py tests/test_command_platform_service.py
      - run: python -m py_compile graen/crypto/service_v6.py graen/crypto/shadow_v6.py graen/crypto/btc_xgb_replication_v14.py graen/crypto/btc_4h_consensus_v14_r2h.py
      - run: python -m pytest -q tests/test_iren_codex_handoff.py tests/test_iren_executor_service.py tests/test_iren_control_plane.py tests/test_iren_runtime_evidence.py
      - run: python -m pytest -q tests/test_iren_executor.py tests/test_iren_work.py tests/test_runtime_topology.py tests/test_graen_runtime.py tests/test_graen_research_executor.py tests/test_graen_crypto_v7.py tests/test_graen_leadlag_r2.py tests/test_graen_activity_shock_v9.py tests/test_graen_autonomous_campaign.py tests/test_graen_trend_pullback_v10.py tests/test_graen_v9_executor.py tests/test_graen_v10_executor.py tests/test_graen_btc_v14.py tests/test_graen_btc_v14_r2a.py tests/test_graen_btc_v14_r2b.py tests/test_graen_btc_v14_r2c.py tests/test_graen_btc_v14_r2d.py tests/test_graen_btc_v14_r2e.py tests/test_graen_btc_v14_r2f.py tests/test_graen_btc_v14_r2g.py tests/test_graen_btc_v14_r2h.py tests/test_graen_v14_executor.py
      - run: python -m pytest -q tests/test_foundation_command_iren.py tests/test_foundation_graen_gateway.py tests/test_foundation_ingest.py tests/test_foundation_iren_gateway.py tests/test_foundation_outbox.py tests/test_foundation_parity.py tests/test_foundation_public_feed.py tests/test_foundation_report_read.py tests/test_foundation_research_agent_gateway.py tests/test_foundation_shadow.py
      - run: python -m pytest -q tests/test_strategy_health.py tests/test_research_agent_runner.py tests/test_research_scheduler.py tests/test_slack_notifier.py tests/test_slack_brand.py tests/test_replay.py tests/test_velum.py tests/test_velum_manifest.py tests/test_orchestration_scheduler.py tests/test_scheduler_ledger_schema.py tests/test_preopen_safety.py tests/test_production_hardening.py tests/test_graen_crypto_v5.py tests/test_graen_crypto_v6.py tests/test_graen_crypto_shadow_v6.py tests/test_nostra_runtime.py
  velum-graen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m py_compile graen/crypto/research_v7.py graen/crypto/autonomous_campaign.py graen/crypto/activity_shock_v9.py graen/crypto/trend_pullback_v10.py app/velum_graen.py app/velum_service.py
      - run: python -m pytest -q tests/test_velum.py tests/test_velum_manifest.py

  graen-forward-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m py_compile graen/crypto/trend_pullback_v10.py graen/crypto/candidate_shadow.py graen/crypto/service_v6.py
      - run: python -m pytest -q tests/test_graen_candidate_shadow.py tests/test_graen_crypto_service.py

  graen-v14-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-graen-ml.txt pytest==8.3.5
      - run: python -c "import numpy, xgboost; print(numpy.__version__, xgboost.__version__)"
      - run: python -m py_compile graen/crypto/btc_xgb_replication_v14.py app/graen/research_executor_service.py
      - run: python -m pytest -q tests/test_graen_btc_v14.py tests/test_graen_v14_executor.py

  codex-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: codex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/codex_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==8.3.5
      - name: Apply and reapply canonical migrations in isolated database
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" python -m foundation.migrator.run
          DATABASE_URL="$TEST_DATABASE_URL" python -m foundation.migrator.run
      - run: python -m pytest -q tests/test_iren_handoff_postgres.py tests/test_platform_core_postgres.py tests/test_platform_money_postgres.py tests/test_command_platform_postgres.py
