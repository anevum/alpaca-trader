name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m scripts.staging_check
      - run: python -m py_compile graen/crypto/service_v6.py graen/crypto/shadow_v6.py graen/crypto/research_v7.py graen/crypto/leadlag_r2.py app/graen/research_executor_service.py
      - run: python -m pytest -q tests/test_iren_control_plane.py tests/test_iren_work.py tests/test_iren_executor.py tests/test_graen_runtime.py tests/test_graen_research_executor.py tests/test_graen_leadlag_r2.py
      - run: python -m pytest -q tests/test_strategy_health.py tests/test_research_agent_runner.py tests/test_research_scheduler.py tests/test_slack_notifier.py tests/test_slack_brand.py tests/test_replay.py tests/test_velum.py tests/test_velum_manifest.py tests/test_orchestration_scheduler.py tests/test_scheduler_ledger_schema.py tests/test_preopen_safety.py tests/test_production_hardening.py tests/test_graen_crypto_v5.py tests/test_graen_crypto_v6.py tests/test_graen_crypto_shadow_v6.py tests/test_graen_crypto_v7.py
  iren-command:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/iren-command/handler_test.ts
      - run: deno check supabase/functions/iren-command/index.ts
      - run: deno check supabase/functions/scheduler-gateway/index.ts
      - run: deno check supabase/functions/iren-slack/index.ts
      - run: deno check supabase/functions/graen-gateway/index.ts
