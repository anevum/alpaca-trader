name: MATH-001-D Benchmark Temporary

on:
  pull_request:
    branches:
      - main

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependence benchmark
        run: |
          PYTHONPATH=. python scripts/math001_d_dependence.py \
            --replicates 2000 \
            --candidates 20 \
            --observations 120 \
            --alpha 0.05 \
            --common-factor-weight 0.8 \
            --ar-phi 0.75 \
            --seed 1003
