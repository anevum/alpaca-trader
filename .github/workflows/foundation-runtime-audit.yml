name: Foundation runtime audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory legacy references in tracked text
        shell: bash
        run: |
          git rev-parse HEAD
          git grep -n -i -I -E 'supabase|/functions/v1' -- ':!.github/workflows/foundation-runtime-audit.yml' || test "$?" = 1
      - name: Reject legacy vendor endpoints in required runtime
        shell: bash
        run: |
          if git grep -n -i -I -E 'supabase\.co|/functions/v1|SUPABASE_(URL|KEY|SERVICE_ROLE|ANON)' app foundation graen requirements.txt Dockerfile; then
            exit 1
          else
            test "$?" = 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==8.3.5
      - name: Verify Access and IREN Command boundaries
        run: python -m pytest -q tests/test_command_access.py tests/test_foundation_command_iren.py
