[build]
builder = "DOCKERFILE"
# Leave dockerfilePath unset here. Normal services still auto-detect the root
# Dockerfile, while services with RAILWAY_DOCKERFILE_PATH can select a
# service-specific Dockerfile without being overridden by this global config.

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
